<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>EmilioAK</title>

    <!-- moved into page-data -->
    <link rel="stylesheet" href="page-data/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css" />

    <!-- icons moved into page-data/img -->
    <link rel="icon" type="image/png" sizes="32x32" href="page-data/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="page-data/img/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="page-data/img/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="page-data/img/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="page-data/img/apple-touch-icon.png" />
</head>

<body>
    <div class="activity-bar">
        <i class="codicon codicon-files selected" title="Explorer" aria-label="Explorer"></i>
        <i class="codicon codicon-search" title="Search" aria-label="Search"></i>
        <i class="codicon codicon-source-control" title="Source Control" aria-label="Source Control"></i>
        <i class="codicon codicon-extensions" title="Extensions" aria-label="Extensions"></i>
    </div>

    <div class="sidebar-header">
        EXPLORER
    </div>

    <div class="tab-bar"></div>

    <template id="tab-template">
        <div class="tab">
            <span class="icon file-icon tab-icon" aria-hidden="true"></span>
            <span class="tab-label"></span>
            <i class="codicon codicon-close tab-close" title="Close" aria-label="Close tab"></i>
        </div>
    </template>

    <div class="sidebar">
        <template id="file-template">
            <div class="sidebar-file">
                <span class="icon file-icon" aria-hidden="true"></span>
                <span class="sidebar-file-name"></span>
            </div>
        </template>

        <template id="folder-template">
            <div class="sidebar-folder">
                <div class="sidebar-file sidebar-folder-header">
                    <i class="codicon codicon-chevron-down" title="Folder" aria-label="Folder"></i>
                    <span class="sidebar-folder-name"></span>
                </div>
                <div class="sidebar-folder-content"></div>
            </div>
        </template>

        <div id="file-tree"></div>
    </div>

    <div id="monaco-editor" class="editor"></div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"
        crossorigin="anonymous"></script>

    <script>
        const fileTreeContainer = document.getElementById('file-tree');
        const fileTemplate = document.getElementById('file-template');
        const folderTemplate = document.getElementById('folder-template');
        const tabTemplate = document.getElementById('tab-template');
        const editorContainer = document.getElementById('monaco-editor');
        const tabBar = document.querySelector('.tab-bar');

        const defaultFilePath = 'README.md';

        const setiExtensionMap = {
            md: 'seti-markdown',
            mdx: 'seti-markdown',
            markdown: 'seti-markdown',
            html: 'seti-html',
            htm: 'seti-html',
            json: 'seti-json',
            yml: 'seti-yml',
            yaml: 'seti-yml',
            txt: 'seti-default',
        };

        const languageExtensionMap = {
            css: 'css',
            htm: 'html',
            html: 'html',
            js: 'javascript',
            json: 'json',
            md: 'markdown',
            mdx: 'markdown',
            mdwn: 'markdown',
            mdtext: 'markdown',
            markdown: 'markdown',
            mdown: 'markdown',
            scss: 'scss',
            ts: 'typescript',
            txt: 'plaintext',
            yml: 'yaml',
            yaml: 'yaml',
        };

        let selectedFileElement = null;
        let monacoEditor = null;
        let activeFilePath = null;
        let fileNodesByPath = new Map();
        const openTabs = new Map();

        const initialEditorMessage = [
            '# Welcome',
            '',
            'Select a file from the Explorer to preview its contents here.',
            '',
            'Files are loaded in read-only mode.'
        ].join('\n');

        const monacoReady = new Promise((resolve) => {
            require.config({
                paths: {
                    'vs': 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs'
                }
            });

            require(['vs/editor/editor.main'], function () {
                monacoEditor = monaco.editor.create(editorContainer, {
                    value: initialEditorMessage,
                    language: 'markdown',
                    theme: 'vs-dark',
                    readOnly: true,
                    automaticLayout: true
                });

                resolve();
            });
        });

        const buildFileTree = async () => {
            try {
                // file list moved into page-data
                const response = await fetch('page-data/file-list.txt');

                if (!response.ok) {
                    throw new Error(`Unable to load file list (${response.status})`);
                }

                const text = await response.text();
                const paths = text.split('\n').map((line) => line.trim()).filter(Boolean);
                const tree = createTreeFromPaths(paths);

                fileNodesByPath = new Map();
                fileTreeContainer.innerHTML = '';

                renderTreeChildren(tree, fileTreeContainer);
                selectDefaultFile();
            } catch (error) {
                console.error('Failed to build file tree:', error);
            }
        };

        const showWelcomeMessage = async () => {
            await monacoReady;
            monacoEditor.setValue(initialEditorMessage);
            monaco.editor.setModelLanguage(monacoEditor.getModel(), 'markdown');
        };

        const createTreeFromPaths = (paths) => {
            const root = {
                type: 'folder',
                name: '',
                path: '',
                children: new Map()
            };

            paths.forEach((path) => {
                const parts = path.split('/');
                let current = root;

                parts.forEach((part, index) => {
                    const isFile = index === parts.length - 1;
                    const nextPath = current.path ? `${current.path}/${part}` : part;

                    if (!current.children.has(part)) {
                        current.children.set(part, {
                            type: isFile ? 'file' : 'folder',
                            name: part,
                            path: nextPath,
                            children: isFile ? null : new Map(),
                        });
                    }

                    current = current.children.get(part);
                });
            });

            return root;
        };

        const findFileElementByPath = (path) => {
            return Array.from(fileTreeContainer.querySelectorAll('.sidebar-file[data-path]'))
                .find((el) => el.dataset.path === path) || null;
        };

        const setSelectedFileElement = (fileElement) => {
            if (selectedFileElement) {
                selectedFileElement.classList.remove('selected');
            }

            selectedFileElement = fileElement;

            if (selectedFileElement) {
                selectedFileElement.classList.add('selected');
            }
        };

        const getFileLanguage = (fileName) => {
            const lowerName = fileName.toLowerCase();
            const lastDot = lowerName.lastIndexOf('.');
            const extension = lastDot > 0 ? lowerName.slice(lastDot + 1) : '';

            return languageExtensionMap[extension] || 'plaintext';
        };

        const selectDefaultFile = () => {
            const defaultNode = fileNodesByPath.get(defaultFilePath);
            const defaultElement = findFileElementByPath(defaultFilePath);

            if (defaultNode && defaultElement) {
                openFileInEditor(defaultNode, defaultElement);
            }
        };

        const setActiveTab = (path) => {
            Array.from(tabBar.children).forEach((tab) => {
                tab.classList.toggle('active', tab.dataset.path === path);
            });
        };

        const openFileByPath = (path) => {
            const node = fileNodesByPath.get(path);
            const fileElement = findFileElementByPath(path);

            if (node && fileElement) {
                openFileInEditor(node, fileElement);
            }
        };

        // Files are served from the published root; no external fallbacks are needed.
        const buildFileUrl = (path) => {
            return path.split('/').map((part) => encodeURIComponent(part)).join('/');
        };

        const loadFileContent = async (path) => {
            const url = buildFileUrl(path);

            try {
                const response = await fetch(url);

                if (response.ok) {
                    return await response.text();
                }

                throw new Error(`Request failed with status ${response.status}`);
            } catch (error) {
                console.error(`Failed to fetch ${url}:`, error);
                throw new Error('Unable to load file content.');
            }
        };

        const createTabElement = (node) => {
            const tabElement = tabTemplate.content.firstElementChild.cloneNode(true);
            const tabIcon = tabElement.querySelector('.tab-icon');
            const tabLabel = tabElement.querySelector('.tab-label');
            const closeButton = tabElement.querySelector('.tab-close');

            tabElement.dataset.path = node.path;
            setIconForFile(node.name, tabIcon);
            tabLabel.textContent = node.name;

            tabElement.addEventListener('click', () => openFileByPath(node.path));
            closeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                closeTab(node.path);
            });

            return tabElement;
        };

        const ensureTabForFile = (node) => {
            if (openTabs.has(node.path)) {
                return openTabs.get(node.path);
            }

            const tabElement = createTabElement(node);
            tabBar.appendChild(tabElement);
            openTabs.set(node.path, tabElement);

            return tabElement;
        };

        const closeTab = (path) => {
            const tabElement = openTabs.get(path);
            if (!tabElement) return;

            const tabs = Array.from(tabBar.children);
            const tabIndex = tabs.indexOf(tabElement);

            tabElement.remove();
            openTabs.delete(path);

            if (activeFilePath === path) {
                const remainingTabs = Array.from(tabBar.children);
                const fallbackTab = remainingTabs[tabIndex] || remainingTabs[tabIndex - 1];

                if (fallbackTab) {
                    openFileByPath(fallbackTab.dataset.path);
                } else {
                    activeFilePath = null;
                    setActiveTab(null);
                    setSelectedFileElement(null);
                    showWelcomeMessage();
                }
            }
        };

        const openFileInEditor = async (node, fileElement) => {
            setSelectedFileElement(fileElement);
            ensureTabForFile(node);
            setActiveTab(node.path);
            activeFilePath = node.path;

            await monacoReady;

            monacoEditor.setValue(`Loading ${node.path}...`);
            monaco.editor.setModelLanguage(monacoEditor.getModel(), 'markdown');

            try {
                const content = await loadFileContent(node.path);
                if (activeFilePath !== node.path) return;

                const language = getFileLanguage(node.name);

                monacoEditor.setValue(content);
                monaco.editor.setModelLanguage(monacoEditor.getModel(), language);
            } catch (error) {
                if (activeFilePath !== node.path) return;

                monacoEditor.setValue(`Unable to load ${node.path}\n\n${error.message}`);
                monaco.editor.setModelLanguage(monacoEditor.getModel(), 'markdown');
                console.error(`Failed to load file ${node.path}:`, error);
            }
        };

        const renderTreeChildren = (node, container) => {
            const children = Array.from(node.children.values()).sort((a, b) => {
                if (a.type === b.type) {
                    return a.name.localeCompare(b.name);
                }
                return a.type === 'folder' ? -1 : 1;
            });

            children.forEach((child) => {
                if (child.type === 'file') {
                    container.appendChild(createFileElement(child));
                } else {
                    container.appendChild(createFolderElement(child));
                }
            });
        };

        const createFileElement = (node) => {
            const fileElement = fileTemplate.content.firstElementChild.cloneNode(true);
            const iconElement = fileElement.querySelector('.file-icon');

            setIconForFile(node.name, iconElement);
            fileElement.querySelector('.sidebar-file-name').textContent = node.name;
            fileElement.dataset.path = node.path;
            fileElement.title = node.path;

            fileNodesByPath.set(node.path, node);

            fileElement.addEventListener('click', () => openFileInEditor(node, fileElement));

            return fileElement;
        };

        const createFolderElement = (node) => {
            const folderElement = folderTemplate.content.firstElementChild.cloneNode(true);
            const folderName = folderElement.querySelector('.sidebar-folder-name');
            const folderContent = folderElement.querySelector('.sidebar-folder-content');
            const chevron = folderElement.querySelector('.codicon');
            const header = folderElement.querySelector('.sidebar-folder-header');

            const collapsedByDefault = node.path !== 'CV';
            let isOpen = !collapsedByDefault;

            folderName.textContent = node.name;
            renderTreeChildren(node, folderContent);

            const updateChevron = () => {
                chevron.classList.toggle('codicon-chevron-down', isOpen);
                chevron.classList.toggle('codicon-chevron-right', !isOpen);
                folderContent.style.display = isOpen ? '' : 'none';
            };

            header.addEventListener('click', () => {
                isOpen = !isOpen;
                updateChevron();
            });

            updateChevron();

            return folderElement;
        };

        const setIconForFile = (fileName, iconElement) => {
            const setiClass = getSetiIconClass(fileName);
            const preservedClasses = Array.from(iconElement.classList).filter((className) => {
                return className !== 'seti-icon' &&
                    !className.startsWith('seti-') &&
                    className !== 'codicon' &&
                    !className.startsWith('codicon-');
            });

            iconElement.className = preservedClasses.join(' ');

            if (setiClass) {
                iconElement.classList.add('seti-icon', setiClass);
            } else {
                iconElement.classList.add('codicon', 'codicon-file');
            }
        };

        const getSetiIconClass = (fileName) => {
            const lowerName = fileName.toLowerCase();
            const lastDot = lowerName.lastIndexOf('.');
            const extension = lastDot > 0 ? lowerName.slice(lastDot + 1) : '';

            if (extension && setiExtensionMap[extension]) {
                return setiExtensionMap[extension];
            }

            if (lowerName === 'license') return 'seti-license';
            if (lowerName === 'cname' || lowerName === '.gitignore') return 'seti-config';

            return 'seti-default';
        };

        buildFileTree();
    </script>
</body>

</html>
