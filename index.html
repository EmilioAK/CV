<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EmilioAK</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css" />
    <link rel="stylesheet" href="page-data/style.css" />

    <link rel="icon" type="image/png" sizes="32x32" href="page-data/img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="page-data/img/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="page-data/img/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="page-data/img/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="page-data/img/apple-touch-icon.png" />
</head>

<body>
    <nav class="activity-bar" aria-label="Workspace views">
        <button id="explorer-toggle" class="activity-button selected" type="button"
            title="Explorer" aria-label="Explorer" aria-controls="explorer-view"
            aria-expanded="true">
            <i class="codicon codicon-files" aria-hidden="true"></i>
        </button>
        <button id="search-toggle" class="activity-button" type="button"
            title="Search (Shift+Command+F)" aria-label="Search" aria-controls="search-view"
            aria-keyshortcuts="Control+Shift+F Meta+Shift+F" aria-expanded="false">
            <i class="codicon codicon-search" aria-hidden="true"></i>
        </button>
    </nav>

    <aside id="workspace-sidebar" class="sidebar" aria-label="Explorer">
        <section id="explorer-view" class="sidebar-view" aria-labelledby="explorer-view-title">
            <div class="sidebar-header">
                <span id="explorer-view-title">EXPLORER</span>
                <button class="sidebar-close" type="button"
                    title="Close Explorer" aria-label="Close Explorer">
                    <i class="codicon codicon-close" aria-hidden="true"></i>
                </button>
            </div>

            <div class="sidebar-content">
                <template id="file-template">
                    <button class="sidebar-file" type="button" role="treeitem"
                        aria-selected="false" tabindex="-1">
                        <span class="icon file-icon" aria-hidden="true"></span>
                        <span class="sidebar-file-name"></span>
                    </button>
                </template>

                <template id="folder-template">
                    <div class="sidebar-folder" role="none">
                        <button class="sidebar-file sidebar-folder-header" type="button"
                            role="treeitem" aria-expanded="false" tabindex="-1">
                            <i class="codicon codicon-chevron-right" aria-hidden="true"></i>
                            <span class="sidebar-folder-name"></span>
                        </button>
                        <div class="sidebar-folder-content" role="group" hidden></div>
                    </div>
                </template>

                <div id="file-tree" role="tree" aria-label="Repository files" aria-busy="true">
                    <div class="tree-loading" role="status">
                        <span class="sr-only">Loading repository files.</span>
                        <span class="tree-skeleton tree-skeleton-wide"></span>
                        <span class="tree-skeleton"></span>
                        <span class="tree-skeleton tree-skeleton-short"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="search-view" class="sidebar-view" aria-labelledby="search-view-title" hidden>
            <div class="sidebar-header">
                <span id="search-view-title">SEARCH</span>
                <button class="sidebar-close" type="button"
                    title="Close Search" aria-label="Close Search">
                    <i class="codicon codicon-close" aria-hidden="true"></i>
                </button>
            </div>

            <div class="sidebar-content search-sidebar-content">
                <form id="search-form" class="search-form" role="search">
                    <label class="search-label" for="search-input">Search my CV</label>
                    <div class="search-input-shell">
                        <i class="codicon codicon-search" aria-hidden="true"></i>
                        <input id="search-input" type="search" autocomplete="off"
                            spellcheck="false" placeholder="Search my CV"
                            aria-describedby="search-help search-status"
                            aria-controls="search-results" />
                        <button id="search-clear" class="search-clear" type="button"
                            title="Clear Search" aria-label="Clear Search" hidden>
                            <i class="codicon codicon-close" aria-hidden="true"></i>
                        </button>
                    </div>
                    <span id="search-help" class="search-help">
                        Search my experience, skills, and contact details.
                    </span>
                </form>

                <div id="search-status" class="search-status" role="status"
                    aria-live="polite"></div>

                <div id="search-empty" class="search-empty">
                    <div class="search-section">
                        <span class="search-section-title">TRY A SEARCH</span>
                        <div class="search-suggestions" aria-label="Suggested searches">
                            <button type="button" data-search-query="Microsoft">Microsoft</button>
                            <button type="button" data-search-query="cloud">cloud</button>
                            <button type="button" data-search-query="teaching">teaching</button>
                            <button type="button" data-search-query="security">security</button>
                        </div>
                    </div>

                    <div class="search-section">
                        <span class="search-section-title">QUICK ACTIONS</span>
                        <div id="search-quick-actions" class="search-actions"></div>
                    </div>
                </div>

                <div id="search-loading" class="search-loading" role="status" hidden>
                    <span class="sr-only">Preparing the search index.</span>
                    <span class="search-skeleton search-skeleton-wide"></span>
                    <span class="search-skeleton"></span>
                    <span class="search-skeleton search-skeleton-short"></span>
                </div>

                <div id="search-results" class="search-results"
                    aria-label="Search results" hidden></div>
            </div>
        </section>
    </aside>

    <button id="sidebar-scrim" class="sidebar-scrim" type="button"
        aria-label="Close sidebar" tabindex="-1"></button>

    <main class="workspace" aria-label="Source browser">
        <div class="tab-bar" role="toolbar" aria-label="Open files"></div>

        <template id="tab-template">
            <div class="tab">
                <button class="tab-select" type="button"
                    aria-pressed="false" tabindex="-1">
                    <span class="icon file-icon tab-icon" aria-hidden="true"></span>
                    <span class="tab-label"></span>
                </button>
                <button class="tab-close" type="button" title="Close file">
                    <i class="codicon codicon-close" aria-hidden="true"></i>
                    <span class="sr-only tab-close-label">Close file</span>
                </button>
            </div>
        </template>

        <div id="source-panel" class="editor-stage" role="region"
            aria-label="File preview">
            <div id="editor-state" class="editor-state" role="status" aria-live="polite">
                <div class="state-copy">
                    <strong id="state-title">Loading site</strong>
                    <span id="state-detail">Preparing the repository browser.</span>
                </div>
                <div id="editor-skeleton" class="editor-skeleton" aria-hidden="true">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>

            <div id="monaco-editor" class="editor" hidden></div>

            <section id="media-viewer" class="media-viewer" aria-label="File preview" hidden>
                <div class="media-preview">
                    <img id="media-image" alt="" hidden />
                    <iframe id="pdf-viewer" class="pdf-viewer" title="PDF preview" hidden></iframe>
                    <i id="binary-icon" class="codicon codicon-file-binary binary-icon"
                        aria-hidden="true" hidden></i>
                </div>
                <div class="media-details">
                    <strong id="media-title"></strong>
                    <span id="media-description"></span>
                    <a id="media-download" class="media-download" download>Download file</a>
                </div>
            </section>
        </div>
    </main>

    <script id="monaco-loader"
        src="https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs/loader.js"
        crossorigin="anonymous"></script>

    <script type="module">
        import {
            createSearchDocument,
            isCareerPath,
            isSearchableEntry,
            parseSearchQuery,
            searchDocuments,
        } from './page-data/search.mjs';

        const manifestPath = 'page-data/file-manifest.json';
        const defaultFilePath = 'README.md';
        const mobileQuery = window.matchMedia('(max-width: 767px)');

        const body = document.body;
        const explorerToggle = document.getElementById('explorer-toggle');
        const searchToggle = document.getElementById('search-toggle');
        const sidebar = document.getElementById('workspace-sidebar');
        const explorerView = document.getElementById('explorer-view');
        const searchView = document.getElementById('search-view');
        const sidebarCloseButtons = document.querySelectorAll('.sidebar-close');
        const sidebarScrim = document.getElementById('sidebar-scrim');
        const fileTreeContainer = document.getElementById('file-tree');
        const fileTemplate = document.getElementById('file-template');
        const folderTemplate = document.getElementById('folder-template');
        const searchForm = document.getElementById('search-form');
        const searchInput = document.getElementById('search-input');
        const searchClear = document.getElementById('search-clear');
        const searchStatus = document.getElementById('search-status');
        const searchEmpty = document.getElementById('search-empty');
        const searchLoading = document.getElementById('search-loading');
        const searchResults = document.getElementById('search-results');
        const searchSuggestionButtons = document.querySelectorAll('[data-search-query]');
        const searchQuickActions = document.getElementById('search-quick-actions');
        const tabTemplate = document.getElementById('tab-template');
        const tabBar = document.querySelector('.tab-bar');
        const editorContainer = document.getElementById('monaco-editor');
        const editorState = document.getElementById('editor-state');
        const editorSkeleton = document.getElementById('editor-skeleton');
        const stateTitle = document.getElementById('state-title');
        const stateDetail = document.getElementById('state-detail');
        const mediaViewer = document.getElementById('media-viewer');
        const mediaImage = document.getElementById('media-image');
        const pdfViewer = document.getElementById('pdf-viewer');
        const binaryIcon = document.getElementById('binary-icon');
        const mediaTitle = document.getElementById('media-title');
        const mediaDescription = document.getElementById('media-description');
        const mediaDownload = document.getElementById('media-download');

        const setiExtensionMap = {
            md: 'seti-markdown',
            mdx: 'seti-markdown',
            markdown: 'seti-markdown',
            html: 'seti-html',
            htm: 'seti-html',
            json: 'seti-json',
            yml: 'seti-yml',
            yaml: 'seti-yml',
            txt: 'seti-default',
        };

        let selectedFileElement = null;
        let monacoEditor = null;
        let activeFilePath = null;
        let activeObjectUrl = null;
        let desktopSidebarOpen = true;
        let mobileSidebarOpen = false;
        let activeSidebarView = 'explorer';
        let manifestEntries = [];
        let searchDocumentsPromise = null;
        let searchRequestId = 0;
        let searchDecorationCollection = null;
        let fileNodesByPath = new Map();
        let fileElementsByPath = new Map();
        let folderControllers = new Map();
        const fileContentPromises = new Map();
        const openTabs = new Map();
        let resolveManifestReady;
        let rejectManifestReady;
        const manifestReady = new Promise((resolve, reject) => {
            resolveManifestReady = resolve;
            rejectManifestReady = reject;
        });

        manifestReady.catch(() => {});

        const sidebarControls = new Map([
            ['explorer', {
                button: explorerToggle,
                view: explorerView,
                label: 'Explorer',
            }],
            ['search', {
                button: searchToggle,
                view: searchView,
                label: 'Search',
            }],
        ]);

        const quickActions = [
            {
                id: 'resume',
                label: 'Open my resume',
                description: 'View or download the PDF',
                icon: 'codicon-file-pdf',
                keywords: 'resume cv pdf download',
                path: 'CV/Emilio_Alvarez_Resume.pdf',
            },
            {
                id: 'email',
                label: 'Email me',
                description: 'me@emilioak.dev',
                icon: 'codicon-mail',
                keywords: 'email contact message emilio',
                href: 'mailto:me@emilioak.dev',
            },
            {
                id: 'linkedin',
                label: 'Open my LinkedIn',
                description: 'linkedin.com/in/EmilioAK',
                icon: 'codicon-link-external',
                keywords: 'linkedin profile social emilio',
                href: 'https://www.linkedin.com/in/EmilioAK',
                external: true,
            },
            {
                id: 'github',
                label: 'Open my GitHub',
                description: 'github.com/EmilioAK',
                icon: 'codicon-github-inverted',
                keywords: 'github code repository source emilio',
                href: 'https://github.com/EmilioAK',
                external: true,
            },
        ];

        const monacoReady = new Promise((resolve, reject) => {
            if (typeof window.require !== 'function') {
                reject(new Error('The source editor did not load.'));
                return;
            }

            window.require.config({
                paths: {
                    vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.55.1/min/vs'
                }
            });

            window.require(
                ['vs/editor/editor.main'],
                () => {
                    monacoEditor = monaco.editor.create(editorContainer, {
                        value: '',
                        language: 'plaintext',
                        theme: 'vs-dark',
                        readOnly: true,
                        automaticLayout: true,
                        wordWrap: 'on',
                        wrappingStrategy: 'advanced',
                        wrappingIndent: 'same',
                        fontSize: 16,
                        scrollBeyondLastLine: false,
                        minimap: {
                            enabled: !mobileQuery.matches
                        },
                        accessibilitySupport: 'auto',
                    });

                    resolve(monacoEditor);
                },
                () => reject(new Error('The source editor did not load.'))
            );
        });

        monacoReady.catch(() => {});

        const clearSearchDecorations = () => {
            searchDecorationCollection?.clear();
            searchDecorationCollection = null;
        };

        const clearObjectUrl = () => {
            pdfViewer.hidden = true;
            pdfViewer.removeAttribute('src');
            mediaViewer.classList.remove('pdf-mode');

            if (activeObjectUrl) {
                URL.revokeObjectURL(activeObjectUrl);
                activeObjectUrl = null;
            }
        };

        const showState = (type, title, detail) => {
            clearObjectUrl();
            clearSearchDecorations();
            editorContainer.hidden = true;
            mediaViewer.hidden = true;
            editorState.hidden = false;
            editorState.dataset.type = type;
            editorState.setAttribute('role', type === 'error' ? 'alert' : 'status');
            editorSkeleton.hidden = type !== 'loading';
            stateTitle.textContent = title;
            stateDetail.textContent = detail;
        };

        const showEditor = () => {
            clearObjectUrl();
            editorState.hidden = true;
            mediaViewer.hidden = true;
            editorContainer.hidden = false;
            requestAnimationFrame(() => monacoEditor?.layout());
        };

        const showMedia = () => {
            clearSearchDecorations();
            editorState.hidden = true;
            editorContainer.hidden = true;
            mediaViewer.hidden = false;
        };

        const formatBytes = (size) => {
            if (!Number.isFinite(size)) return 'Generated file';
            if (size < 1024) return `${size} bytes`;
            if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
            return `${(size / (1024 * 1024)).toFixed(1)} MB`;
        };

        const encodeRoutePath = (filePath) => filePath
            .split('/')
            .map((part) => encodeURIComponent(part))
            .join('/');

        const getRoutePath = () => {
            if (!window.location.hash.startsWith('#/')) return null;

            try {
                return window.location.hash
                    .slice(2)
                    .split('/')
                    .map((part) => decodeURIComponent(part))
                    .join('/');
            } catch {
                return null;
            }
        };

        const updateRoute = (filePath, mode) => {
            if (!mode) return;

            const hash = `#/${encodeRoutePath(filePath)}`;
            const url = `${window.location.pathname}${window.location.search}${hash}`;

            if (mode === 'replace') {
                window.history.replaceState({ filePath }, '', url);
            } else if (window.location.hash !== hash) {
                window.history.pushState({ filePath }, '', url);
            }
        };

        const clearRoute = (mode = 'push') => {
            if (!mode) return;

            const url = `${window.location.pathname}${window.location.search}`;
            if (mode === 'replace') {
                window.history.replaceState({}, '', url);
            } else if (window.location.hash) {
                window.history.pushState({}, '', url);
            }
        };

        const isSidebarOpen = () => mobileQuery.matches
            ? mobileSidebarOpen
            : desktopSidebarOpen;

        const syncSidebar = () => {
            const sidebarOpen = isSidebarOpen();

            sidebarControls.forEach((control, viewName) => {
                const isActive = activeSidebarView === viewName;
                const isInteractive = isActive && sidebarOpen;
                control.view.hidden = !isActive;
                control.view.inert = !isInteractive;
                control.view.setAttribute('aria-hidden', String(!isInteractive));
                control.button.setAttribute('aria-expanded', String(isInteractive));
                control.button.classList.toggle('selected', isInteractive);
            });

            sidebar.setAttribute(
                'aria-label',
                sidebarControls.get(activeSidebarView)?.label || 'Workspace'
            );
            sidebar.hidden = !sidebarOpen;
            sidebar.inert = !sidebarOpen;
            sidebar.setAttribute('aria-hidden', String(!sidebarOpen));

            if (mobileQuery.matches) {
                body.classList.remove('sidebar-collapsed');
                body.classList.toggle('sidebar-open', mobileSidebarOpen);
                sidebarScrim.tabIndex = mobileSidebarOpen ? 0 : -1;
            } else {
                body.classList.remove('sidebar-open');
                body.classList.toggle('sidebar-collapsed', !desktopSidebarOpen);
                sidebarScrim.tabIndex = -1;
            }

            if (monacoEditor) {
                monacoEditor.updateOptions({
                    minimap: {
                        enabled: !mobileQuery.matches
                    }
                });
                requestAnimationFrame(() => monacoEditor.layout());
            }
        };

        const closeSidebar = (restoreFocus = true) => {
            if (mobileQuery.matches) {
                mobileSidebarOpen = false;
            } else {
                desktopSidebarOpen = false;
            }
            syncSidebar();

            if (restoreFocus) {
                sidebarControls.get(activeSidebarView)?.button.focus();
            }
        };

        const closeMobileSidebar = (restoreFocus = true) => {
            if (!mobileQuery.matches || !mobileSidebarOpen) return;
            closeSidebar(restoreFocus);
        };

        const activateSidebarView = (viewName, toggleCurrent = false) => {
            if (!sidebarControls.has(viewName)) return;

            const selectedCurrentView = activeSidebarView === viewName;
            if (selectedCurrentView && toggleCurrent && isSidebarOpen()) {
                closeSidebar(false);
                return;
            }

            activeSidebarView = viewName;
            if (mobileQuery.matches) {
                mobileSidebarOpen = true;
            } else {
                desktopSidebarOpen = true;
            }
            syncSidebar();

            if (viewName === 'search') {
                requestAnimationFrame(() => searchInput.focus());
            }
        };

        explorerToggle.addEventListener('click', () => {
            activateSidebarView('explorer', true);
        });

        searchToggle.addEventListener('click', () => {
            activateSidebarView('search', true);
        });

        sidebarCloseButtons.forEach((button) => {
            button.addEventListener('click', () => closeSidebar());
        });
        sidebarScrim.addEventListener('click', () => closeMobileSidebar());
        mobileQuery.addEventListener('change', () => {
            mobileSidebarOpen = false;
            syncSidebar();
        });

        document.addEventListener('keydown', (event) => {
            const opensSearch = (event.metaKey || event.ctrlKey)
                && event.shiftKey
                && event.key.toLocaleLowerCase() === 'f';

            if (opensSearch) {
                event.preventDefault();
                activateSidebarView('search');
                return;
            }

            if (event.key === 'Escape') closeMobileSidebar();
        });

        const createTreeFromEntries = (entries) => {
            const root = {
                type: 'folder',
                name: '',
                path: '',
                children: new Map()
            };

            entries.forEach((entry) => {
                const parts = entry.path.split('/');
                let current = root;

                parts.forEach((part, index) => {
                    const isFile = index === parts.length - 1;
                    const nextPath = current.path ? `${current.path}/${part}` : part;

                    if (!current.children.has(part)) {
                        current.children.set(part, isFile
                            ? {
                                ...entry,
                                type: 'file',
                                name: part,
                                path: nextPath,
                                children: null,
                            }
                            : {
                                type: 'folder',
                                name: part,
                                path: nextPath,
                                children: new Map(),
                            });
                    }

                    current = current.children.get(part);
                });
            });

            return root;
        };

        const setTreeFocus = (item) => {
            fileTreeContainer.querySelectorAll('[role="treeitem"]').forEach((treeItem) => {
                treeItem.tabIndex = treeItem === item ? 0 : -1;
            });
            item?.focus();
        };

        const setTreeTabStop = (item) => {
            fileTreeContainer.querySelectorAll('[role="treeitem"]').forEach((treeItem) => {
                treeItem.tabIndex = treeItem === item ? 0 : -1;
            });
        };

        const getVisibleTreeItems = () => Array.from(
            fileTreeContainer.querySelectorAll('[role="treeitem"]')
        ).filter((item) => item.offsetParent !== null);

        fileTreeContainer.addEventListener('keydown', (event) => {
            const current = event.target.closest('[role="treeitem"]');
            if (!current) return;

            if (event.key === 'Enter' || event.key === ' ') {
                event.preventDefault();
                current.click();
                return;
            }

            const items = getVisibleTreeItems();
            const currentIndex = items.indexOf(current);
            let nextItem = null;

            if (event.key === 'ArrowDown') {
                nextItem = items[Math.min(currentIndex + 1, items.length - 1)];
            } else if (event.key === 'ArrowUp') {
                nextItem = items[Math.max(currentIndex - 1, 0)];
            } else if (event.key === 'Home') {
                nextItem = items[0];
            } else if (event.key === 'End') {
                nextItem = items[items.length - 1];
            } else if (event.key === 'ArrowRight' && current.matches('.sidebar-folder-header')) {
                const folderPath = current.dataset.folderPath;
                const controller = folderControllers.get(folderPath);
                if (current.getAttribute('aria-expanded') === 'false') {
                    controller?.setOpen(true);
                } else {
                    nextItem = controller?.element.querySelector('[role="group"] [role="treeitem"]');
                }
            } else if (event.key === 'ArrowLeft') {
                const owningFolder = current.closest('.sidebar-folder');
                if (current.matches('.sidebar-folder-header')
                    && current.getAttribute('aria-expanded') === 'true') {
                    folderControllers.get(current.dataset.folderPath)?.setOpen(false);
                } else {
                    const parentFolder = current.matches('.sidebar-folder-header')
                        ? owningFolder?.parentElement?.closest('.sidebar-folder')
                        : owningFolder;
                    const parentHeader = parentFolder
                        ?.querySelector(':scope > .sidebar-folder-header');
                    nextItem = parentHeader || null;
                }
            } else {
                return;
            }

            event.preventDefault();
            if (nextItem) setTreeFocus(nextItem);
        });

        const setSelectedFileElement = (fileElement) => {
            if (selectedFileElement) {
                selectedFileElement.classList.remove('selected');
                selectedFileElement.setAttribute('aria-selected', 'false');
            }

            selectedFileElement = fileElement;

            if (selectedFileElement) {
                selectedFileElement.classList.add('selected');
                selectedFileElement.setAttribute('aria-selected', 'true');
                setTreeTabStop(selectedFileElement);
            }
        };

        const getSetiIconClass = (fileName) => {
            const lowerName = fileName.toLowerCase();
            const lastDot = lowerName.lastIndexOf('.');
            const extension = lastDot > 0 ? lowerName.slice(lastDot + 1) : '';

            if (extension && setiExtensionMap[extension]) {
                return setiExtensionMap[extension];
            }

            if (lowerName === 'license') return 'seti-license';
            if (lowerName === 'cname' || lowerName === '.gitignore') return 'seti-config';

            return 'seti-default';
        };

        const setIconForFile = (fileName, iconElement) => {
            const setiClass = getSetiIconClass(fileName);
            const preservedClasses = Array.from(iconElement.classList).filter((className) => {
                return className !== 'seti-icon'
                    && !className.startsWith('seti-')
                    && className !== 'codicon'
                    && !className.startsWith('codicon-');
            });

            iconElement.className = preservedClasses.join(' ');
            iconElement.classList.add('seti-icon', setiClass);
        };

        const setActiveTab = (filePath) => {
            let activeTabElement = null;

            openTabs.forEach((tabElement, tabPath) => {
                const selectButton = tabElement.querySelector('.tab-select');
                const isActive = tabPath === filePath;
                tabElement.classList.toggle('active', isActive);
                selectButton.setAttribute('aria-pressed', String(isActive));
                selectButton.tabIndex = isActive ? 0 : -1;
                if (isActive) activeTabElement = tabElement;
            });

            requestAnimationFrame(() => {
                activeTabElement?.scrollIntoView({
                    block: 'nearest',
                    inline: 'nearest'
                });
            });
        };

        const createTabElement = (node) => {
            const tabElement = tabTemplate.content.firstElementChild.cloneNode(true);
            const tabIcon = tabElement.querySelector('.tab-icon');
            const tabLabel = tabElement.querySelector('.tab-label');
            const selectButton = tabElement.querySelector('.tab-select');
            const closeButton = tabElement.querySelector('.tab-close');
            const closeLabel = tabElement.querySelector('.tab-close-label');

            tabElement.dataset.path = node.path;
            selectButton.setAttribute('aria-controls', 'source-panel');
            selectButton.setAttribute('aria-label', node.path);
            closeButton.setAttribute('aria-label', `Close ${node.path}`);
            closeLabel.textContent = `Close ${node.name}`;
            setIconForFile(node.name, tabIcon);
            tabLabel.textContent = node.name;

            selectButton.addEventListener('click', () => openFileByPath(node.path));
            selectButton.addEventListener('keydown', (event) => {
                if (event.key !== 'ArrowLeft' && event.key !== 'ArrowRight') return;

                const tabs = Array.from(tabBar.querySelectorAll('.tab-select'));
                const currentIndex = tabs.indexOf(selectButton);
                const offset = event.key === 'ArrowRight' ? 1 : -1;
                const nextIndex = (currentIndex + offset + tabs.length) % tabs.length;
                event.preventDefault();
                tabs[nextIndex].click();
                tabs[nextIndex].focus();
            });

            closeButton.addEventListener('click', (event) => {
                event.stopPropagation();
                closeTab(node.path);
            });

            return tabElement;
        };

        const ensureTabForFile = (node) => {
            if (openTabs.has(node.path)) {
                return openTabs.get(node.path);
            }

            const tabElement = createTabElement(node);
            tabBar.appendChild(tabElement);
            openTabs.set(node.path, tabElement);

            return tabElement;
        };

        const revealFilePath = (filePath) => {
            const parts = filePath.split('/');

            for (let index = 1; index < parts.length; index += 1) {
                const folderPath = parts.slice(0, index).join('/');
                folderControllers.get(folderPath)?.setOpen(true);
            }
        };

        const loadResponse = async (node) => {
            let directResponse = null;
            let rawResponse = null;

            try {
                directResponse = await fetch(node.sourceUrl, { cache: 'no-cache' });
            } catch {
                directResponse = null;
            }

            if (directResponse?.ok) return directResponse;

            if (node.rawUrl) {
                try {
                    rawResponse = await fetch(node.rawUrl, { cache: 'no-cache' });
                } catch {
                    rawResponse = null;
                }
            }

            if (rawResponse?.ok) return rawResponse;

            const directResult = directResponse
                ? `status ${directResponse.status}`
                : 'a network error';
            const rawResult = rawResponse
                ? `status ${rawResponse.status}`
                : 'a network error';

            throw new Error(`The source returned ${directResult}. GitHub returned ${rawResult}.`);
        };

        const loadTextContent = (node) => {
            if (!fileContentPromises.has(node.path)) {
                const contentPromise = loadResponse(node)
                    .then((response) => response.text())
                    .catch((error) => {
                        fileContentPromises.delete(node.path);
                        throw error;
                    });
                fileContentPromises.set(node.path, contentPromise);
            }

            return fileContentPromises.get(node.path);
        };

        const revealSearchMatch = (editor, location) => {
            clearSearchDecorations();
            if (!location) return;

            const model = editor.getModel();
            const lineNumber = Math.min(
                Math.max(1, location.lineNumber),
                model.getLineCount()
            );
            const maximumColumn = model.getLineMaxColumn(lineNumber);
            const startColumn = Math.min(
                Math.max(1, location.column),
                maximumColumn
            );
            const endColumn = Math.min(
                maximumColumn,
                startColumn + Math.max(1, location.matchLength)
            );
            const range = new monaco.Range(
                lineNumber,
                startColumn,
                lineNumber,
                Math.max(startColumn + 1, endColumn)
            );

            searchDecorationCollection = editor.createDecorationsCollection([{
                range,
                options: {
                    inlineClassName: 'search-match-highlight',
                    overviewRuler: {
                        color: '#e2c08d',
                        position: monaco.editor.OverviewRulerLane.Center,
                    },
                },
            }]);
            editor.setSelection(range);
            editor.revealLineInCenter(lineNumber);
            requestAnimationFrame(() => editor.focus());
        };

        const renderTextFile = async (node, location = null) => {
            showState('loading', `Loading ${node.name}`, 'Preparing the source view.');

            const [editor, content] = await Promise.all([
                monacoReady,
                loadTextContent(node),
            ]);

            if (activeFilePath !== node.path) return;

            editor.setValue(content);
            monaco.editor.setModelLanguage(editor.getModel(), node.language || 'plaintext');
            showEditor();
            revealSearchMatch(editor, location);
        };

        const renderImageFile = async (node) => {
            showState('loading', `Loading ${node.name}`, 'Preparing the image preview.');
            const response = await loadResponse(node);
            const blob = await response.blob();

            if (activeFilePath !== node.path) return;

            activeObjectUrl = URL.createObjectURL(blob);
            mediaImage.src = activeObjectUrl;
            mediaImage.alt = `Preview of ${node.path}`;
            await mediaImage.decode();

            if (activeFilePath !== node.path) return;

            mediaImage.hidden = false;
            binaryIcon.hidden = true;
            mediaTitle.textContent = node.path;
            mediaDescription.textContent = `${node.mediaType} - ${formatBytes(node.size)}`;
            mediaDownload.href = activeObjectUrl;
            mediaDownload.download = node.name;
            showMedia();
        };

        const renderPdfFile = async (node) => {
            showState('loading', `Loading ${node.name}`, 'Preparing the PDF preview.');
            const response = await loadResponse(node);
            const blob = await response.blob();

            if (activeFilePath !== node.path) return;

            activeObjectUrl = URL.createObjectURL(blob);
            mediaImage.hidden = true;
            mediaImage.removeAttribute('src');
            binaryIcon.hidden = true;
            pdfViewer.src = activeObjectUrl;
            pdfViewer.title = `Preview of ${node.path}`;
            pdfViewer.hidden = false;
            mediaViewer.classList.add('pdf-mode');
            mediaTitle.textContent = node.path;
            mediaDescription.textContent = `${node.mediaType} - ${formatBytes(node.size)}`;
            mediaDownload.href = activeObjectUrl;
            mediaDownload.download = node.name;
            showMedia();
        };

        const renderBinaryFile = async (node) => {
            showState('loading', `Loading ${node.name}`, 'Preparing the file details.');
            const response = await loadResponse(node);
            const blob = await response.blob();

            if (activeFilePath !== node.path) return;

            activeObjectUrl = URL.createObjectURL(blob);
            mediaImage.hidden = true;
            mediaImage.removeAttribute('src');
            binaryIcon.hidden = false;
            mediaTitle.textContent = node.path;
            mediaDescription.textContent = `${node.mediaType} - ${formatBytes(node.size)}`;
            mediaDownload.href = activeObjectUrl;
            mediaDownload.download = node.name;
            showMedia();
        };

        const openFileInEditor = async (
            node,
            fileElement,
            historyMode = 'push',
            location = null,
        ) => {
            revealFilePath(node.path);
            setSelectedFileElement(fileElement);
            ensureTabForFile(node);
            setActiveTab(node.path);
            activeFilePath = node.path;
            document.title = `${node.name} - EmilioAK`;
            updateRoute(node.path, historyMode);

            if (mobileQuery.matches) {
                closeMobileSidebar(false);
            }

            try {
                if (node.mediaType === 'application/pdf') {
                    await renderPdfFile(node);
                } else if (node.kind === 'image') {
                    await renderImageFile(node);
                } else if (node.kind === 'binary') {
                    await renderBinaryFile(node);
                } else {
                    await renderTextFile(node, location);
                }
            } catch (error) {
                if (activeFilePath !== node.path) return;

                showState(
                    'error',
                    `Unable to open ${node.name}`,
                    error instanceof Error ? error.message : 'The file did not load.'
                );
                console.error(`Failed to load file ${node.path}:`, error);
            }
        };

        const openFileByPath = (filePath, historyMode = 'push') => {
            const node = fileNodesByPath.get(filePath);
            const fileElement = fileElementsByPath.get(filePath);

            if (node && fileElement) {
                void openFileInEditor(node, fileElement, historyMode);
                return true;
            }

            return false;
        };

        const createActionElement = (action) => {
            const element = document.createElement(action.href ? 'a' : 'button');
            element.className = 'search-action';

            if (action.href) {
                element.href = action.href;
                if (action.external) {
                    element.target = '_blank';
                    element.rel = 'noreferrer';
                }
            } else {
                element.type = 'button';
                element.addEventListener('click', () => {
                    if (!openFileByPath(action.path)) {
                        searchStatus.textContent = 'The resume is still loading.';
                    }
                });
            }

            const icon = document.createElement('i');
            icon.className = `codicon ${action.icon}`;
            icon.setAttribute('aria-hidden', 'true');

            const copy = document.createElement('span');
            copy.className = 'search-action-copy';

            const label = document.createElement('strong');
            label.textContent = action.label;

            const description = document.createElement('small');
            description.textContent = action.description;

            copy.append(label, description);
            element.append(icon, copy);

            return element;
        };

        const renderQuickActions = () => {
            searchQuickActions.replaceChildren(
                ...quickActions.map((action) => createActionElement(action))
            );
        };

        const getMatchingActions = (rawQuery) => {
            const { terms } = parseSearchQuery(rawQuery);

            return quickActions.filter((action) => {
                const searchableText = `${action.label} ${action.description} ${action.keywords}`
                    .toLocaleLowerCase();
                return terms.every((term) => searchableText.includes(term));
            });
        };

        const setSearchState = (state, status = '') => {
            searchEmpty.hidden = state !== 'empty';
            searchLoading.hidden = state !== 'loading';
            searchResults.hidden = state !== 'results' && state !== 'error';
            searchStatus.textContent = status;
        };

        const buildSearchDocuments = async () => {
            if (searchDocumentsPromise) return searchDocumentsPromise;

            searchDocumentsPromise = (async () => {
                await manifestReady;

                const searchableEntries = manifestEntries.filter((entry) => {
                    return isSearchableEntry(entry) && isCareerPath(entry.path);
                });
                const settledDocuments = await Promise.allSettled(
                    searchableEntries.map(async (entry) => {
                        const content = await loadTextContent(entry);
                        return createSearchDocument(entry, content);
                    })
                );
                const documents = settledDocuments
                    .filter((result) => result.status === 'fulfilled')
                    .map((result) => result.value);
                const failureCount = settledDocuments.length - documents.length;

                if (documents.length === 0) {
                    throw new Error('The searchable files did not load.');
                }

                return { documents, failureCount };
            })().catch((error) => {
                searchDocumentsPromise = null;
                throw error;
            });

            return searchDocumentsPromise;
        };

        const appendHighlightedText = (container, text, rawQuery) => {
            const { query } = parseSearchQuery(rawQuery);
            const terms = query
                .split(' ')
                .filter(Boolean)
                .sort((left, right) => right.length - left.length)
                .map((term) => term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));

            if (terms.length === 0) {
                container.textContent = text;
                return;
            }

            const expression = new RegExp(`(${terms.join('|')})`, 'gi');
            text.split(expression).filter(Boolean).forEach((part) => {
                if (expression.test(part)) {
                    const mark = document.createElement('mark');
                    mark.textContent = part;
                    container.appendChild(mark);
                } else {
                    container.appendChild(document.createTextNode(part));
                }
                expression.lastIndex = 0;
            });
        };

        const openSearchMatch = (path, match) => {
            const node = fileNodesByPath.get(path);
            const fileElement = fileElementsByPath.get(path);

            if (!node || !fileElement) {
                searchStatus.textContent = 'The selected file is not available.';
                return;
            }

            void openFileInEditor(
                node,
                fileElement,
                'push',
                match.pathOnly ? null : match,
            );
        };

        const createResultActionSection = (actions) => {
            const section = document.createElement('section');
            section.className = 'search-result-section';
            section.setAttribute('aria-label', 'Actions');

            const heading = document.createElement('div');
            heading.className = 'search-results-heading';
            heading.textContent = 'ACTIONS';
            section.appendChild(heading);

            actions.forEach((action) => {
                section.appendChild(createActionElement(action));
            });

            return section;
        };

        const createResultGroup = (group, rawQuery) => {
            const section = document.createElement('section');
            section.className = 'search-result-group';
            section.setAttribute('aria-label', `${group.path}, ${group.matchCount} matches`);

            const fileButton = document.createElement('button');
            fileButton.className = 'search-result-file';
            fileButton.type = 'button';

            const fileIcon = document.createElement('span');
            fileIcon.className = 'icon file-icon';
            fileIcon.setAttribute('aria-hidden', 'true');
            setIconForFile(group.path, fileIcon);

            const path = document.createElement('span');
            path.className = 'search-result-path';
            path.textContent = group.path;

            const count = document.createElement('span');
            count.className = 'search-result-count';
            count.textContent = String(group.matchCount);
            count.setAttribute('aria-hidden', 'true');

            fileButton.append(fileIcon, path, count);
            fileButton.addEventListener('click', () => {
                openSearchMatch(group.path, group.matches[0]);
            });
            section.appendChild(fileButton);

            group.matches.forEach((match) => {
                const matchButton = document.createElement('button');
                matchButton.className = 'search-result-match';
                matchButton.type = 'button';
                matchButton.setAttribute(
                    'aria-label',
                    `${group.path}, line ${match.lineNumber}: ${match.snippet}`
                );

                const lineNumber = document.createElement('span');
                lineNumber.className = 'search-result-line';
                lineNumber.textContent = String(match.lineNumber);
                lineNumber.setAttribute('aria-hidden', 'true');

                const snippet = document.createElement('span');
                snippet.className = 'search-result-snippet';
                appendHighlightedText(snippet, match.snippet, rawQuery);

                matchButton.append(lineNumber, snippet);
                matchButton.addEventListener('click', () => {
                    openSearchMatch(group.path, match);
                });
                section.appendChild(matchButton);
            });

            if (group.matchCount > group.matches.length) {
                const remaining = document.createElement('span');
                remaining.className = 'search-result-more';
                remaining.textContent = `${group.matchCount - group.matches.length} more matches`;
                section.appendChild(remaining);
            }

            return section;
        };

        const renderSearchResults = (result, actions, failureCount) => {
            searchResults.replaceChildren();

            if (actions.length > 0) {
                searchResults.appendChild(createResultActionSection(actions));
            }

            if (result.groups.length > 0) {
                const heading = document.createElement('div');
                heading.className = 'search-results-heading search-file-results-heading';
                heading.textContent = 'CV MATCHES';
                searchResults.appendChild(heading);

                result.groups.forEach((group) => {
                    searchResults.appendChild(createResultGroup(group, result.query));
                });
            }

            if (actions.length === 0 && result.groups.length === 0) {
                const message = document.createElement('div');
                message.className = 'search-message';

                const title = document.createElement('strong');
                title.textContent = 'No CV matches';

                const detail = document.createElement('span');
                detail.textContent = 'Try another search term.';

                message.append(title, detail);
                searchResults.appendChild(message);
            }

            const statusParts = [];
            if (result.totalMatches > 0) {
                const fileWord = result.totalFiles === 1 ? 'file' : 'files';
                statusParts.push(
                    `${result.totalMatches} matches in ${result.totalFiles} ${fileWord}`
                );
            }
            if (actions.length > 0) {
                const actionWord = actions.length === 1 ? 'action' : 'actions';
                statusParts.push(`${actions.length} ${actionWord}`);
            }
            if (statusParts.length === 0) {
                statusParts.push('No matches');
            }
            if (failureCount > 0) {
                statusParts.push(`${failureCount} source files unavailable`);
            }

            setSearchState('results', `${statusParts.join('. ')}.`);
        };

        const renderSearchError = (error) => {
            const message = document.createElement('div');
            message.className = 'search-message search-message-error';

            const title = document.createElement('strong');
            title.textContent = 'Search is unavailable';

            const detail = document.createElement('span');
            detail.textContent = error instanceof Error
                ? error.message
                : 'The search index did not load.';

            const retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = 'Try again';
            retry.addEventListener('click', () => void executeSearch());

            message.append(title, detail, retry);
            searchResults.replaceChildren(message);
            setSearchState('error', 'Search failed.');
        };

        const executeSearch = async () => {
            const requestId = ++searchRequestId;
            const { query } = parseSearchQuery(searchInput.value);
            searchClear.hidden = !query;

            if (!query) {
                searchResults.replaceChildren();
                setSearchState('empty');
                return;
            }

            setSearchState('loading', 'Preparing search.');

            try {
                const { documents, failureCount } = await buildSearchDocuments();
                if (requestId !== searchRequestId) return;

                const result = searchDocuments(documents, query);
                const actions = getMatchingActions(query);
                renderSearchResults(result, actions, failureCount);
            } catch (error) {
                if (requestId !== searchRequestId) return;
                renderSearchError(error);
            }
        };

        let searchDebounceTimer = null;

        searchInput.addEventListener('input', () => {
            searchClear.hidden = !parseSearchQuery(searchInput.value).query;
            window.clearTimeout(searchDebounceTimer);
            searchDebounceTimer = window.setTimeout(() => void executeSearch(), 120);
        });

        searchInput.addEventListener('keydown', (event) => {
            if (event.key === 'Escape' && searchInput.value) {
                event.preventDefault();
                event.stopPropagation();
                searchInput.value = '';
                void executeSearch();
                return;
            }

            if (event.key === 'ArrowDown') {
                const firstResult = searchResults.querySelector('button, a');
                if (firstResult) {
                    event.preventDefault();
                    firstResult.focus();
                }
            }
        });

        searchClear.addEventListener('click', () => {
            searchInput.value = '';
            void executeSearch();
            searchInput.focus();
        });

        searchForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const firstMatch = searchResults.querySelector('.search-result-match');
            if (firstMatch) {
                firstMatch.click();
            } else {
                void executeSearch();
            }
        });

        searchSuggestionButtons.forEach((button) => {
            button.addEventListener('click', () => {
                searchInput.value = button.dataset.searchQuery;
                void executeSearch();
                searchInput.focus();
            });
        });

        renderQuickActions();

        const showEmptyEditor = (historyMode = 'push') => {
            activeFilePath = null;
            selectedFileElement?.classList.remove('selected');
            selectedFileElement?.setAttribute('aria-selected', 'false');
            selectedFileElement = null;
            setActiveTab(null);
            document.title = 'EmilioAK';
            showState('empty', 'No file open', 'Select a file from the Explorer.');
            clearRoute(historyMode);
        };

        const closeTab = (filePath) => {
            const tabElement = openTabs.get(filePath);
            if (!tabElement) return;

            const tabs = Array.from(tabBar.children);
            const tabIndex = tabs.indexOf(tabElement);

            tabElement.remove();
            openTabs.delete(filePath);

            if (activeFilePath === filePath) {
                const remainingTabs = Array.from(tabBar.children);
                const fallbackTab = remainingTabs[tabIndex] || remainingTabs[tabIndex - 1];

                if (fallbackTab) {
                    openFileByPath(fallbackTab.dataset.path);
                } else {
                    showEmptyEditor();
                }
            }
        };

        const renderTreeChildren = (node, container) => {
            const children = Array.from(node.children.values()).sort((left, right) => {
                if (left.type === right.type) {
                    return left.name.localeCompare(right.name);
                }
                return left.type === 'folder' ? -1 : 1;
            });

            children.forEach((child) => {
                container.appendChild(child.type === 'file'
                    ? createFileElement(child)
                    : createFolderElement(child));
            });
        };

        const createFileElement = (node) => {
            const fileElement = fileTemplate.content.firstElementChild.cloneNode(true);
            const iconElement = fileElement.querySelector('.file-icon');

            setIconForFile(node.name, iconElement);
            fileElement.querySelector('.sidebar-file-name').textContent = node.name;
            fileElement.dataset.path = node.path;
            fileElement.title = node.path;
            fileElement.setAttribute('aria-label', node.path);
            fileElement.setAttribute('aria-level', String(node.path.split('/').length));

            fileNodesByPath.set(node.path, node);
            fileElementsByPath.set(node.path, fileElement);
            fileElement.addEventListener('click', () => {
                setTreeFocus(fileElement);
                void openFileInEditor(node, fileElement);
            });

            return fileElement;
        };

        const createFolderElement = (node) => {
            const folderElement = folderTemplate.content.firstElementChild.cloneNode(true);
            const folderName = folderElement.querySelector('.sidebar-folder-name');
            const folderContent = folderElement.querySelector('.sidebar-folder-content');
            const chevron = folderElement.querySelector('.codicon');
            const header = folderElement.querySelector('.sidebar-folder-header');
            const collapsedByDefault = node.path !== 'CV';
            let isOpen = !collapsedByDefault;

            folderName.textContent = node.name;
            header.dataset.folderPath = node.path;
            header.setAttribute('aria-label', node.path);
            header.setAttribute('aria-level', String(node.path.split('/').length));

            const setOpen = (nextOpen) => {
                isOpen = nextOpen;
                header.setAttribute('aria-expanded', String(isOpen));
                chevron.classList.toggle('codicon-chevron-down', isOpen);
                chevron.classList.toggle('codicon-chevron-right', !isOpen);
                folderContent.hidden = !isOpen;
            };

            folderControllers.set(node.path, {
                element: folderElement,
                setOpen,
            });

            renderTreeChildren(node, folderContent);
            header.addEventListener('click', () => {
                setOpen(!isOpen);
                setTreeFocus(header);
            });
            setOpen(isOpen);

            return folderElement;
        };

        const selectInitialFile = () => {
            const routedPath = getRoutePath();

            if (routedPath && openFileByPath(routedPath, null)) return;
            if (openFileByPath(defaultFilePath, 'replace')) return;

            showState('empty', 'No source files', 'The source manifest contains no default file.');
        };

        const buildFileTree = async () => {
            try {
                const response = await fetch(manifestPath, { cache: 'no-cache' });

                if (!response.ok) {
                    throw new Error(`The server returned status ${response.status}.`);
                }

                const manifest = await response.json();
                if (manifest.schemaVersion !== 2 || !Array.isArray(manifest.files)) {
                    throw new Error('The source manifest is not valid.');
                }

                manifestEntries = manifest.files;
                fileNodesByPath = new Map();
                fileElementsByPath = new Map();
                folderControllers = new Map();
                fileTreeContainer.replaceChildren();

                const tree = createTreeFromEntries(manifestEntries);
                renderTreeChildren(tree, fileTreeContainer);
                fileTreeContainer.setAttribute('aria-busy', 'false');
                resolveManifestReady(manifestEntries);

                const firstTreeItem = fileTreeContainer.querySelector('[role="treeitem"]');
                if (firstTreeItem) firstTreeItem.tabIndex = 0;

                selectInitialFile();
            } catch (error) {
                fileTreeContainer.setAttribute('aria-busy', 'false');
                const message = document.createElement('div');
                message.className = 'tree-error';
                message.setAttribute('role', 'alert');
                message.textContent = error instanceof Error
                    ? error.message
                    : 'The repository files did not load.';
                fileTreeContainer.replaceChildren(message);
                rejectManifestReady(error);
                showState('error', 'Unable to load the site', 'The repository manifest did not load.');
                console.error('Failed to build the file tree:', error);
            }
        };

        window.addEventListener('popstate', () => {
            const routedPath = getRoutePath();

            if (routedPath && openFileByPath(routedPath, null)) return;
            if (!routedPath) showEmptyEditor(null);
        });

        syncSidebar();
        void buildFileTree();
    </script>
</body>

</html>
