<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>EmilioAK</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@vscode/codicons/dist/codicon.css" />
    <link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="img/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="img/android-chrome-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="img/android-chrome-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="img/apple-touch-icon.png" />
</head>

<body>
    <div class="activity-bar">
        <i class="codicon codicon-files selected" title="Explorer" aria-label="Explorer"></i>
        <i class="codicon codicon-search" title="Search" aria-label="Search"></i>
        <i class="codicon codicon-source-control" title="Source Control" aria-label="Source Control"></i>
        <i class="codicon codicon-extensions" title="Extensions" aria-label="Extensions"></i>
    </div>

    <div class="sidebar-header">
        EXPLORER
    </div>
    <div class="tab-bar"></div>
    <div class="sidebar">
        <div class="sidebar-file">
            <span class="icon seti-icon seti-markdown" aria-hidden="true"></span> <span class="sidebar-file-name">README.md</span>
        </div>
        <div class="sidebar-folder">
            <div class="sidebar-file sidebar-folder-header">
                <i class="codicon codicon-chevron-down" title="Folder" aria-label="Folder"></i> <span class="sidebar-folder-name">CV</span>
            </div>
            <div class="sidebar-folder-content">
                <div class="sidebar-file">
                    <span class="icon seti-icon seti-markdown" aria-hidden="true"></span> <span class="sidebar-file-name">about.md</span>
                </div>
        <div class="sidebar-folder">
            <div class="sidebar-file sidebar-folder-header">
                <i class="codicon codicon-chevron-down" title="Folder" aria-label="Folder"></i> <span class="sidebar-folder-name">work</span>
            </div>
            <div class="sidebar-folder-content">
                        <div class="sidebar-file">
                            <span class="icon seti-icon seti-markdown" aria-hidden="true"></span> <span class="sidebar-file-name">job1.md</span>
                        </div>
                        <div class="sidebar-file">
                            <span class="icon seti-icon seti-markdown" aria-hidden="true"></span> <span class="sidebar-file-name">job2.md</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="monaco-editor" class="editor"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs/loader.min.js" crossorigin="anonymous"></script>
    <script>
        const editorContainer = document.getElementById('monaco-editor');

        require.config({
            paths: {
                'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.53.0/min/vs'
            }
        });

        require(['vs/editor/editor.main'], function () {
            monaco.editor.create(editorContainer, {
                value: [
                    '# Info about me',
                    '',
                    'This Monaco editor is read-only so you can browse without making edits.',
                    '',
                    '- Update this text by changing docs/index.html when ready.'
                ].join('\n'),
                language: 'markdown',
                theme: 'vs-dark',
                readOnly: true,
                automaticLayout: true
            });
        });
    </script>
</body>

</html>
